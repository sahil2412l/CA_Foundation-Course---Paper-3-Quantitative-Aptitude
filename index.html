35);           osc.connect(gain); gain.connect(ctx.destination);           osc.start(); osc.stop(ctx.currentTime + 0.35);         }       } catch (e) { }     }      // --- 2. Data Bank ---     const CA_MATH_CHAPTERS = [       // --- PART A: Business Mathematics (8 Chapters) ---       {         id: 'ratio_log', title: 'Ratio, Proportion, Indices & Logarithms', weightage: '4 - 6 Marks', category: 'Math',         description: 'Properties of Ratios, Duplicate/Sub-duplicate Ratios, Laws of Indices, Logarithm Change of Base Rule.',         subExercises: [           { id: 'ex_1a', title: 'Exercise 1A: Ratio & Properties', description: 'Duplicate, Sub-duplicate, Triplicate ratios & Compounding', questionCount: 6, formulasCount: 2 },           { id: 'ex_1b', title: 'Exercise 1B: Proportion & Rules', description: 'Mean proportion, Continued proportion, Componendo & Dividendo', questionCount: 5, formulasCount: 2 },           { id: 'ex_1c', title: 'Exercise 1C: Laws of Indices', description: 'Integral & Fractional indices, Exponential simplification', questionCount: 5, formulasCount: 3 },           { id: 'ex_1d', title: 'Exercise 1D: Logarithms & Change of Base', description: 'Log product, quotient, power rules & base change', questionCount: 6, formulasCount: 4 }         ],         formulas: [           { title: 'Duplicate Ratio', formula: 'Duplicate of a:b = a┬▓:b┬▓, Sub-duplicate = ΓêÜa:ΓêÜb', note: 'Triplicate = a┬│:b┬│' },           { title: 'Componendo & Dividendo', formula: 'If a/b = c/d then (a+b)/(a-b) = (c+d)/(c-d)', note: 'Useful in equation solving' },           { title: 'Laws of Logarithms', formula: 'log(m ├ù n) = log m + log n, log(m/n) = log m - log n', note: 'log(m^k) = k log m' },           { title: 'Change of Base Rule', formula: 'log_b(a) = log_c(a) / log_c(b) = 1 / log_a(b)', note: 'log_a(1) = 0, log_a(a) = 1' }         ]       },       {         id: 'equations', title: 'Equations', weightage: '4 - 6 Marks', category: 'Math',         description: 'Linear Equ tempted + 1,             correctQuestionsCount: isCorrect ? prev.correctQuestionsCount + 1 : prev.correctQuestionsCount,             incorrectQuestionsCount: !isCorrect ? prev.incorrectQuestionsCount + 1 : prev.incorrectQuestionsCount,           };           const evaluated = calculateXPAndLevel(updated);           saveUserProfileToCookies(evaluated);           return evaluated;         });       };        if (!currentQ) {         return (           <div className="p-12 text-center text-white space-y-4">             <h2 className="text-xl font-bold">No questions found for this selection.</h2>             <button               onClick={() => { setSelectedChapterIdForQuiz(null); if (setSelectedSubExerciseIdForQuiz) setSelectedSubExerciseIdForQuiz(null); }}               className="px-6 py-2.5 rounded-xl bg-indigo-600 text-xs font-bold text-white"             >               Show All Questions             </button>           </div>         );       }        const filteredJumpQuestions = availableQuestions.filter((q, idx) =>         jumpSearchQuery.trim() === '' ||         `q${idx + 1}`.includes(jumpSearchQuery.toLowerCase()) ||         q.questionText.toLowerCase().includes(jumpSearchQuery.toLowerCase())       );        return (         <div className="mx-auto max-w-4xl p-8 space-y-6">           <div className="flex justify-between items-center flex-wrap gap-4">             <div>               <h1 className="text-2xl font-extrabold text-white">Interactive Math Quiz</h1>               <p className="text-xs text-slate-400">Practice questions topic-wise or exercise-wise.</p>             </div>                          <div className="flex items-center gap-3 flex-wrap">               {/* Topic Selector */}               <select                 value={selectedSubExerciseIdForQuiz ? `SUB:${selectedSubExerciseIdForQuiz}` : (selectedChapterIdForQuiz || 'ALL')}                 onChange={(e) => {                   const val = e.target.value;                   if (val === 'ALL') {                     setSelectedChapterIdForQuiz(null);                     if (setSelectedSubExerciseIdForQuiz) setSelectedSubExerciseIdForQuiz(null);                   } else if (val.startsWith('SUB:')) {                     const subId = val.replace('SUB:', '');                     if (setSelectedSubExerciseIdForQuiz) setSelectedSubExerciseIdForQuiz(subId);                     const parentCh = CA_MATH_CHAPTERS.find(c => c.subExercises && c.subExercises.some(s => s.id === subId));                     if (parentCh) setSelectedChapterIdForQuiz(parentCh.id);                   } else {                     setSelectedChapterIdForQuiz(val);                     if (setSelectedSubExerciseIdForQuiz) setSelectedSubExerciseIdForQuiz(null);                   }                   setCurrentQuestionIndex(0);                   setSelectedOptionIndex(null);                   setIsAnswerSubmitted(false);                 }}                 className="rounded-xl bg-slate-800 border border-slate-700 px-4 py-2 text-xs font-semibold text-white cursor-pointer"               >                 <option value="ALL">All CA Foundation Topics ({MATH_QUESTIONS.length} Qs)</option>                 {CA_MATH_CHAPTERS.map(ch => (                   <React.Fragment key={ch.id}>                     <option value={ch.id}>≡ƒôÜ {ch.title}</option>                     {ch.subExercises && ch.subExercises.map(sub => (                       <option key={sub.id} value={`SUB:${sub.id}`}>-- ≡ƒôæ {sub.title}</option>                     ))}                   </React.Fragment>                 ))}               </select>                {/* Jump Q Dropdown Search Selector */}               <div className="flex items-center gap-2">                 <span className="text-xs text-slate-400 font-semibold">Jump Q:</span>                 <select                   value={currentQuestionIndex}                   onChange={(e) => handleJumpToQuestion(Number(e.target.value))}                   className="rounded-xl bg-slate-900 border border-cyan-500/40 px-3 py-2 text-xs font-bold text-cyan-400 cursor-pointer"                 >                   {availableQuestions.map((q, idx) => (                     <option key={q.id || idx} value={idx}>                       Q{idx + 1}: {q.questionText.length > 35 ? q.questionText.slice(0, 35) + '...' : q.questionText}                     </option>                   ))}                 </select>               </div>             </div>           </div>            <div className="rounded-2xl border border-slate-800 bg-slate-900/60 p-8 space-y-6 shadow-xl backdrop-blur-xl">             <div className="flex justify-between items-center flex-wrap gap-2">               <div className="flex items-center gap-2">                 <span className="rounded-full bg-cyan-500/10 border border-cyan-500/30 px-3 py-1 text-xs text-cyan-400 font-semibold">{currentQ.chapterName}</span>                 {currentQ.subExerciseId && (                   <span className="rounded-full bg-amber-500/10 border border-amber-500/30 px-2.5 py-0.5 text-xs text-amber-400 font-semibold">                     ≡ƒôæ {currentQ.subExerciseId.toUpperCase()}                   </span>                 )}               </div>                {/* Jump Q Trigger Button */}               <button                 onClick={() => setShowJumpModal(true)}                 className="rounded-lg bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-500/40 px-3 py-1 text-xs font-bold text-indigo-300 transition cursor-pointer flex items-center gap-1.5"                 title="Search and jump to any question"               >                 <span>≡ƒöì Search / Jump Q#</span>                 <span className="text-white font-extrabold">{currentQuestionIndex + 1} of {availableQuestions.length}</span>               </button>             </div>              <h2 className="text-lg font-bold text-white leading-relaxed">Q{currentQuestionIndex + 1}. {currentQ.questionText}</h2>              <div className="space-y-3">               {currentQ.options.map((opt, idx) => {                 let btnStyle = "border-slate-700 bg-slate-800/40 text-slate-200 hover:bg-slate-800";                 if (selectedOptionIndex === idx) btnStyle = "border-indigo-500 bg-indigo-500/20 text-white";                 if (isAnswerSubmitted) {                   if (idx === currentQ.correctIndex) btnStyle = "border-emerald-500 bg-emerald-500/20 text-emerald-300 font-bold";                   else if (selectedOptionIndex === idx) btnStyle = "border-rose-500 bg-rose-500/20 text-rose-300";                 }                  return (                   <div                     key={idx}                     onClick={() => !isAnswerSubmitted && setSelectedOptionIndex(idx)}                     className={`cursor-pointer rounded-xl border p-4 text-sm flex items-center gap-3 transition ${btnStyle}`}                   >                     <span className="h-6 w-6 rounded-full bg-slate-700/50 flex items-center justify-center text-xs font-bold">{String.fromCharCode(65 + idx)}</span>                     <span>{opt}</span>                   </div>                 );               })}             </div>              {!isAnswerSubmitted ? (               <div className="flex justify-end">                 <button                   onClick={handleSubmitAnswer}                   disabled={selectedOptionIndex === null}                   className="rounded-xl bg-gradient-to-r from-indigo-500 to-cyan-500 px-8 py-3 text-sm font-bold text-white disabled:opacity-40 shadow-lg cursor-pointer"                 >                   Submit Answer                 </button>               </div>             ) : (               <div className="rounded-xl bg-slate-950 p-4 border border-slate-800 space-y-2">                 {currentQ.formulaUsed && (                   <div className="text-xs text-amber-300 mb-1">≡ƒôÉ <strong>Formula:</strong> <code>{currentQ.formulaUsed}</code></div>                 )}                 <div className="text-sm font-bold text-emerald-400">≡ƒÆí Step-by-step Solution</div>                 <p className="text-xs text-slate-300 leading-relaxed">{currentQ.explanation}</p>                 <div className="flex justify-end pt-2">                   <button                     onClick={() => {                       setSelectedOptionIndex(null);                       setIsAnswerSubmitted(false);                       setCurrentQuestionIndex(prev => prev < availableQuestions.length - 1 ? prev + 1 : 0);                     }}                     className="rounded-xl bg-emerald-600 hover:bg-emerald-500 px-6 py-2.5 text-xs font-bold text-white transition cursor-pointer"                   >                     Next Question ΓåÆ                   </button>                 </div>               </div>             )}           </div>            {/* Jump Modal */}           {showJumpModal && (             <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">               <div className="w-full max-w-lg rounded-2xl border border-indigo-500/40 bg-slate-900 p-6 space-y-4 shadow-2xl">                 <div className="flex justify-between items-center">                   <h3 className="text-lg font-bold text-white flex items-center gap-2">                     ≡ƒöì Search & Jump to Question                   </h3>                   <button onClick={() => setShowJumpModal(false)} className="text-slate-400 hover:text-white text-xl">Γ£ò</button>                 </div>                  <input                   type="text"                   placeholder="Type question number or keywords to search..."                   value={jumpSearchQuery}                   onChange={(e) => setJumpSearchQuery(e.target.value)}                   autoFocus                   className="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-sm text-white focus:border-cyan-400 focus:outline-none"                 />                  <div>                   <span className="text-xs font-bold text-cyan-400">ΓÜí Quick Question Grid:</span>                   <div className="grid grid-cols-6 gap-2 mt-2">                     {availableQuestions.map((q, idx) => (                       <button                         key={q.id || idx}                         onClick={() => handleJumpToQuestion(idx)}                         className={`rounded-lg py-2 text-xs font-bold transition cursor-pointer ${currentQuestionIndex === idx ? 'bg-indigo-600 text-white border border-indigo-400' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}                       >                         Q{idx + 1}                       </button>                     ))}                   </div>                 </div>                  <div className="max-h-60 overflow-y-auto space-y-2 pt-2 border-t border-slate-800">                   <span className="text-xs font-bold text-slate-400">Matching Questions ({filteredJumpQuestions.length}):</span>                   {filteredJumpQuestions.map(q => {                     const origIndex = availableQuestions.indexOf(q);                     return (                       <button                         key={q.id}                         onClick={() => handleJumpToQuestion(origIndex)}                         className={`w-full rounded-xl p-3 text-left transition cursor-pointer border ${currentQuestionIndex === origIndex ? 'bg-indigo-950/60 border-cyan-400' : 'bg-slate-800/60 border-slate-700 hover:bg-slate-800'}`}                       >                         <div className="flex justify-between text-xs mb-1">                           <span className="font-bold text-amber-400">Question {origIndex + 1}</span>                           <span className="text-cyan-400">{q.difficulty}</span>                         </div>                         <p className="text-xs text-slate-200 line-clamp-2">{q.questionText}</p>                       </button>                     );                   })}                 </div>               </div>             </div>           )}         </div>       );     }      function RankPage({ user }) {       return (         <div className="mx-auto max-w-7xl p-8 space-y-6">           <div>             <h1 className="text-2xl font-extrabold text-white">CA Foundation Rank & Level System</h1>             <p className="text-sm text-slate-400">Level up by building Watch Time, solving Math problems correctly!</p>           </div>            <div className="rounded-2xl border border-indigo-500/30 bg-slate-900/60 p-8 flex items-center gap-6">             <div className="h-16 w-16 rounded-2xl bg-indigo-500/20 border border-cyan-400 flex items-center justify-center text-3xl">≡ƒÅå</div>             <div className="flex-1">               <h2 className="text-2xl font-bold text-white">Level {user.level} ΓÇó <span className="text-amber-400">{user.rankTitle}</span></h2>               <p className="text-xs text-cyan-400">Total XP: {user.xp} XP</p>             </div>           </div>         </div>       );     }      function ProfilePage({ user, setUser }) {       const [isEditing, setIsEditing] = useState(false);       const [nameInput, setNameInput] = useState(user.name);       const [goalInput, setGoalInput] = useState(user.dailyGoalMinutes);        const nextLevelXP = Math.pow(user.level, 2) * 100;       const prevLevelXP = Math.pow(user.level - 1, 2) * 100;       const levelRange = nextLevelXP - prevLevelXP;       const currentInLevel = Math.max(0, user.xp - prevLevelXP);       const progressPercent = Math.min(100, Math.round((currentInLevel / (levelRange || 1)) * 100));        const accuracy = user.totalQuestionsAttempted > 0         ? Math.round((user.correctQuestionsCount / user.totalQuestionsAttempted) * 100)         : 0;        const handleSave = (e) => {         e.preventDefault();         setUser(prev => {           const updated = { ...prev, name: nameInput.trim() || 'CA Aspirant', dailyGoalMinutes: Number(goalInput) || 30 };           saveUserProfileToCookies(updated);           return updated;         });         setIsEditing(false);       };        return (         <div className="mx-auto max-w-5xl p-8 space-y-6">           <div className="flex justify-between items-center flex-wrap gap-4">             <div>               <h1 className="text-3xl font-extrabold text-white">User Profile & Aspirant Dashboard</h1>               <p className="text-sm text-slate-400 mt-1">Track your CA Foundation study stats, XP rewards, and level progression.</p>             </div>             <button onClick={() => setIsEditing(!isEditing)} className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 text-sm font-semibold transition">               {isEditing ? 'Cancel' : 'Γ£Å∩╕Å Edit Profile'}             </button>           </div>            {/* Profile Hero Card */}           <div className="rounded-2xl border border-cyan-500/20 bg-gradient-to-r from-slate-900 via-slate-900/90 to-slate-950 p-8 space-y-6 shadow-xl">             <div className="flex items-center gap-6">               <div className="h-20 w-20 rounded-2xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-purple-500 flex items-center justify-center text-4xl shadow-lg border border-white/20">                 ≡ƒÄô               </div>               <div>                 <h2 className="text-2xl font-black text-white">{user.name}</h2>                 <div className="text-sm text-cyan-400 font-semibold mt-1">                   Level {user.level} ΓÇó <span className="text-amber-400">{user.rankTitle}</span>                 </div>               </div>             </div>              {/* Level XP Progress Bar */}             <div className="space-y-2 pt-4 border-t border-slate-800">               <div className="flex justify-between text-xs font-semibold">                 <span className="text-slate-400">Level {user.level} Progress</span>                 <span className="text-cyan-400">{user.xp} Total XP ({progressPercent}% to Level {user.level + 1})</span>               </div>               <div className="h-3 w-full rounded-full bg-slate-950 border border-slate-800 overflow-hidden">                 <div className="h-full rounded-full bg-gradient-to-r from-cyan-400 via-indigo-500 to-purple-500 transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>               </div>             </div>              {/* Edit Form */}             {isEditing && (               <form onSubmit={handleSave} className="p-6 rounded-xl bg-slate-950 border border-slate-800 space-y-4">                 <h3 className="text-base font-bold text-white">Update Profile Settings</h3>                 <div className="grid grid-cols-1 md:grid-cols-2 gap-4">                   <div>                     <label className="text-xs text-slate-400 block mb-1">Aspirant Name:</label>                     <input type="text" value={nameInput} onChange={(e) => setNameInput(e.target.value)} className="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm" />                   </div>                   <div>                     <label className="text-xs text-slate-400 block mb-1">Daily Study Target (Minutes):</label>                     <input type="number" value={goalInput} onChange={(e) => setGoalInput(e.target.value)} className="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm" />                   </div>                 </div>                 <button type="submit" className="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm">Save Profile</button>               </form>             )}           </div>            {/* XP Rules Breakdown Card */}           <div className="rounded-2xl border border-indigo-500/20 bg-slate-900/60 p-6 space-y-4">             <h3 className="text-lg font-bold text-white flex items-center gap-2">ΓÜí How XP & Levelling Work</h3>             <div className="grid grid-cols-1 md:grid-cols-2 gap-4">               <div className="p-4 rounded-xl bg-slate-950 border border-cyan-500/20">                 <div className="text-2xl mb-1">≡ƒÄ»</div>                 <div className="text-lg font-bold text-cyan-400">+4 XP</div>                 <div className="text-xs text-slate-400 mt-1">Per Correct Answer in Quizzes</div>               </div>               <div className="p-4 rounded-xl bg-slate-950 border border-amber-500/20">                 <div className="text-2xl mb-1">≡ƒöÑ</div>                 <div className="text-lg font-bold text-amber-400">+30 XP</div>                 <div className="text-xs text-slate-400 mt-1">Per Consecutive Streak Day</div>               </div>             </div>           </div>            {/* Key Stats Cards */}           <div className="grid grid-cols-1 md:grid-cols-3 gap-4">             <div className="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 text-center">               <div className="text-2xl mb-1">≡ƒÄ»</div>               <div className="text-xl font-bold text-cyan-400">{accuracy}%</div>               <div className="text-xs text-slate-400">Quiz Accuracy</div>             </div>             <div className="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 text-center">               <div className="text-2xl mb-1">≡ƒöÑ</div>               <div className="text-xl font-bold text-amber-400">{user.currentStreakDays} Days</div>               <div className="text-xs text-slate-400">Active Streak</div>             </div>             <div className="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 text-center">               <div className="text-2xl mb-1">≡ƒô¥</div>               <div className="text-xl font-bold text-emerald-400">{user.correctQuestionsCount} / {user.totalQuestionsAttempted}</div>               <div className="text-xs text-slate-400">Correct Questions</div>             </div>           </div>         </div>       );     }      // --- 4. Main App Root ---     function App() {       const [user, setUser] = useState(() => loadUserProfileFromCookies());       const [activeTab, setActiveTab] = useState('dashboard');       const [selectedChapterIdForQuiz, setSelectedChapterIdForQuiz] = useState(null);       const [selectedSubExerciseIdForQuiz, setSelectedSubExerciseIdForQuiz] = useState(null);        return (         <div className="flex min-h-screen">           <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} user={user} />           <main className="flex-1 ml-64 min-w-0">             <Navbar user={user} activeTab={activeTab} />             {activeTab === 'dashboard' && <DashboardPage user={user} setActiveTab={setActiveTab} />}             {activeTab === 'chapters' && <ChaptersPage setActiveTab={setActiveTab} setSelectedChapterIdForQuiz={setSelectedChapterIdForQuiz} setSelectedSubExerciseIdForQuiz={setSelectedSubExerciseIdForQuiz} />}             {activeTab === 'flashcards' && <FlashcardsPage />}             {activeTab === 'calculator' && <CalculatorPage />}             {activeTab === 'quiz' && <QuizPage user={user} setUser={setUser} selectedChapterIdForQuiz={selectedChapterIdForQuiz} setSelectedChapterIdForQuiz={setSelectedChapterIdForQuiz} selectedSubExerciseIdForQuiz={selectedSubExerciseIdForQuiz} setSelectedSubExerciseIdForQuiz={setSelectedSubExerciseIdForQuiz} />}             {activeTab === 'rank' && <RankPage user={user} />}             {activeTab === 'profile' && <ProfilePage user={user} setUser={setUser} />}           </main>         </div>       );     }      const root = ReactDOM.createRoot(document.getElementById('root'));     root.render(<App />);   </script> </body>  </html>
